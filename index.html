<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TI Manager</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;padding:24px;line-height:1.45}
    code{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
    .box{max-width:860px}
    .card{border:1px solid rgba(0,0,0,.12);border-radius:12px;padding:16px;margin-top:16px}
  </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "path": "https://esm.sh/path@^0.12.7",
    "url": "https://esm.sh/url@^0.11.4"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <div id="root"></div>

  <div class="box">
    <h1>TI Manager</h1>
    <p>This repo is meant to be served from a <b>built</b> output folder, not from source files.</p>

    <div class="card">
      <h3>Cloud deploy (static)</h3>
      <pre><code>npm install
npm run build:cloud</code></pre>
      <p>Deploy the folder: <code>dist/</code></p>
    </div>

    <div class="card">
      <h3>Local dev</h3>
      <pre><code>npm install
npm run dev</code></pre>
    </div>
  </div>

  <!-- If you see UI here, you are serving the wrong entry. Deploy the built dist folder. -->
<script type="module" src="/index.tsx"></script>
</body>
</html>
